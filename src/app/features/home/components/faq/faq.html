<section class="faq">
  <div class="container">
    <div class="section-header">
      <span class="eyebrow">FAQ</span>
      <h2>Antworten auf häufig gestellte Fragen</h2>
    </div>

    <div class="faq-list">
      @for (item of items; track item.question) {
        <div class="faq-item" [class.open]="item.open">
          <button class="faq-question" (click)="toggle(item)">
            <span>{{ item.question }}</span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          @if (item.open) {
            <div class="faq-answer">
              <p>{{ item.answer }}</p>
            </div>
          }
        </div>
      }
    </div>

    <p class="closing-note">
      Haben Sie weitere Fragen?
      <a routerLink="/kontakt">Nehmen Sie gerne Kontakt auf.</a>
    </p>
  </div>
</section>
